name: HabitUp CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    name: Build & Test (Go Backend)
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: secret

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

      rabbitmq:
        image: rabbitmq:3-alpine
        ports:
          - 5672:5672

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Go kur
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Bağımlılıkları indir
        working-directory: ./backend
        run: go mod tidy

      - name: Build
        working-directory: ./backend
        run: go build ./...

      - name: Testleri çalıştır
        working-directory: ./backend
        env:
          MONGO_URI: mongodb+srv://ercanaziz2005_db_user:ercan123@cluster0.sibvzna.mongodb.net/habitup?retryWrites=true&w=majority&appName=Cluster0
          REDIS_ADDR: rediss://default:gQAAAAAAAkjrAAIgcDIzNDZhZTJhMGRiZTQ0MjY1OGI5MzEyZDZiZDRkODA3ZA@ace-wildcat-149739.upstash.io:6379
          RABBITMQ_URL: amqps://yqlotmcn:lP37ceVnxhmO6JToAYrawYNo4vGBzjyF@stingray.rmq.cloudamqp.com/yqlotmcn
          JWT_SECRET: supersecretkey123
        run: go test ./... -v

  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Docker Buildx kur
        uses: docker/setup-buildx-action@v3

      - name: Docker image oluştur
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: habitup-backend:latest
